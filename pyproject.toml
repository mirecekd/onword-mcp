[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onword-mcp"
version = "0.1.0"
description = "MCP server for live, surgical editing of the document currently open in Microsoft Word (COM automation, large-document and Teams co-authoring friendly)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Miroslav Dvorak", email = "mirecekd@gmail.com" }]
keywords = ["mcp", "word", "office", "com", "automation", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=2.10",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
onword-mcp = "onword_mcp.server:main"

[project.urls]
Homepage = "https://github.com/mirecekd/onword-mcp"
Repository = "https://github.com/mirecekd/onword-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/onword_mcp"]